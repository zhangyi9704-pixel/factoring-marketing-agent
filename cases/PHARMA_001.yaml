case_id: PHARMA_001
industry: 医药
company: 康诺医疗器械有限公司
client_role: 总经理 林总（林国峰），50 岁
basic_information:
  公司画像:
  - 华东某市医疗器械 + 耗材经销商，成立 12 年，员工 60 人
  - 两票制合规经销商，配送 + 学术推广双轮
  - 年营收约 2.5 亿，下游以公立医院为主。
persona:
  角色: 总经理 林总（林国峰），50 岁
  背景: 医药代理出身，从业 20 年，人脉广
  性格: 关系导向、谈话跳跃、重面子、决策快但要求被尊重
  敏感点: 对"对方懂不懂行"极敏感——听到外行话（不懂两票制/集采/医院回款）会敷衍、降低配合度
  对销售的期待: 懂医药行业规则，有同类案例，别拿通用话术糊弄
transaction_chain:
  payer: 三甲/二甲医院、国有配送商业
  contractor: 康诺医疗器械有限公司
  supplier: 械企厂家
  description: "械企厂家（上游·国产为主+2家外资，款到发货或短账期）\n        ↓ 采购备货\n康诺医械（客户·本项目应收持有方）\n        ↓ 赊销配送\n① 三甲医院×3、二甲医院×4（赊销，预算制付款）\n\
    ② 国有配送商业（省医药公司等，部分票据结算）"
payer_info:
  付款人 ①: 公立医院：账期 6-12 个月，年度预算制、年底集中付款；流程=科室验收→设备科/采购中心对账→财务付款
  付款人 ②: 国有配送商业：账期约 6 个月，约 40% 以银行承兑汇票支付，少量商业承兑汇票
  确权方式: 老三甲合作 8 年，对账确权顺畅；新开发二甲医院确权流程未走通
receivable:
  amount: 65000000
  aging_days: null
  details:
    应收规模: 约 6500 万（医院端 4000 万 + 商业端 2500 万）
    应收形成条件: 医院签收（入库单/随货同行单）+ 月度对账确认
    票据情况: 商业端约 40% 银票；个别商票（承兑人为民营商业公司）
    异常挂账: 一家医院设备科换届，对账停滞 2 个月（约 350 万）
pain_points:
- 新签某三甲五年独家配送协议，需垫资备货 + 缴 200 万履约保证金
- 两票制后毛利收窄，资金周转效率要求变高
- 年底前要压一批岁末订单，备货资金缺口合计约 1000 万。
known_risks:
- 集采扩围导致部分耗材品类降价约 35%，影响后续回款金额与毛利
- 应收中含个别商票（承兑人资质需评估）
- 医院设备科换届致 350 万对账停滞
- 履约保证金 200 万长期占用
- 新医院确权未走通，该部分应收转让存在障碍。
unknown_info:
- 医院明年预算是否受医保控费进一步压缩；未知原因：政策未定；核实路径：转人工/风控
- 新医院确权流程的具体审批环节；未知原因：未走通、无经验；核实路径：需与院方核实
- 商票承兑人的同业授信情况；未知原因：外部信息；核实路径：需外部查证
hidden_risks:
- 一家医院设备科换届，对账停滞2个月（约350万）
- 集采扩围致部分品类降价35%，影响回款与毛利
- 新开发二甲医院确权未走通
