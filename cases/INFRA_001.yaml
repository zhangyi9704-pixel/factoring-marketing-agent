case_id: INFRA_001
industry: 基建
company: 程诚建材贸易有限公司
client_role: 财务总监 陈总（陈志远），45 岁
basic_information:
  公司画像:
  - 华南某市建材贸易公司，成立 8 年，员工 35 人，注册资本 1000 万（实缴）
  - 主营钢筋、水泥、商品混凝土等大宗建材，配送+垫资贸易模式
  - 年营收约 1.2 亿，近三年年均增速 15%
  - 民营企业，自有办公场所（已抵押），无其他可抵押资产。
persona:
  角色: 财务总监 陈总（陈志远），45 岁
  背景: 注册会计师出身，管财务 10 年
  性格: 谨慎、数据导向、慢热；每句话要数字支撑
  敏感点: 被贷款中介骚扰怕了——反感"包装话术"，听到"保证/最快/包过"类字眼立即起疑
  对销售的期待: 专业、懂工程结算，别绕弯子
transaction_chain:
  payer: 市城投下属总包、民企总包
  contractor: 程诚建材贸易有限公司
  supplier: 钢厂/水泥厂
  description: "钢厂/水泥厂（上游·现款提货）\n        ↓ 供货垫资\n程诚建材（客户·本项目应收持有方）\n        ↓ 赊销供货\n① 市城投下属总包——市政污水厂扩建项目（国企背景）\n② 民企总包——安置房二期项目"
payer_info:
  付款人 ①: 市城投下属总承包公司（国企），月度计量、按节点支付，付款依赖财政资金安排
  付款人 ②: 民营总承包公司（房建），按进度付款，资金自筹
  支付方式: 银行转账，无商业承兑汇票习惯
  确权方式: 需项目部 + 财务双线审批（走流程约 2-4 周），历史配合度一般
receivable:
  amount: 28000000
  aging_days: null
  details:
    账期: 供货后月度计量，验收后 90-180 天付款
    应收形成条件: 送货单 + 计量确认 + 三方对账单盖章，缺一不可
    在账应收: 约 2800 万（账龄 6 个月以上约 900 万）
    质保金: 合同扣留 3%-5%，至质保期满（12-24 个月）返还
pain_points:
- 新中标两个项目，上游现款、下游账期，备货垫资缺口 800-1000 万
- 银行授信已用满，再增信无门
- 城投项目计量流程慢，应收"看得见拿不到"。
known_risks:
- 城投项目付款依赖财政资金安排（政策/资金节奏风险）
- 民企总包项目约 300 万送货单仅项目部签收、未完成正式计量（应收未有效形成）
- 质保金长期占用
- 历史上曾因工程质量纠纷被城投总包暂扣 60 万货款（后协商解决）。
unknown_info:
- 城投公司明年财政拨付/资金到位计划；未知原因：政府预算未定；核实路径：转人工/风控（双未知演示钩子：知识库也没有）
- 民企总包在其他机构的授信敞口变化；未知原因：外部信息；核实路径：需外部查证
- 总包确权审批的最新时效；未知原因：流程常变；核实路径：以最新流程核实为准
hidden_risks:
- 民企总包约300万仅项目部签收、未正式计量（应收瑕疵）
- 质保金3%-5%扣留12-24个月
- 曾因质量纠纷被暂扣货款60万（已解决）
