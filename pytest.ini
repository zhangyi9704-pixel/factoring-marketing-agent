[pytest]
testpaths = tests
cache_dir = archive/generated/pytest-cache
addopts = --strict-markers
markers =
    integration: 需要外部服务（Redis/MySQL 等）真实可达的集成测试，运行方式：
        pytest -m integration                        # 使用 config.yaml 默认目标
        APP_DATABASE__REDIS__HOST=x.x.x.x pytest -m integration   # 覆盖目标地址
